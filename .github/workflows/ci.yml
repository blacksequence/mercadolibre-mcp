name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Sync dependencies (runtime + dev tools)
        run: uv sync --extra dev
      - name: Lint
        run: uv run --extra dev ruff check src tests
      - name: Type check
        run: uv run --extra dev pyright
      - name: Tests
        run: uv run --extra dev python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Sync dependencies
        run: uv sync
      - name: Build wheel and source distribution
        run: uv build
      - name: Validate distribution artifacts
        run: |
          test -f dist/mercadolibre_mcp-*.whl
          test -f dist/mercadolibre_mcp-*.tar.gz
          uv run python - <<'PY'
          import zipfile, pathlib
          whl = sorted(pathlib.Path("dist").glob("*.whl"))[-1]
          with zipfile.ZipFile(whl) as z:
            names = z.namelist()
          required = [
            "mercadolibre_mcp/__init__.py",
            "mercadolibre_mcp/auth.py",
            "mercadolibre_mcp/client.py",
            "mercadolibre_mcp/main.py",
            "mercadolibre_mcp-0.3.2.dist-info/entry_points.txt",
          ]
          missing = [n for n in required if n not in names]
          assert not missing, f"missing wheel entries: {missing}"
          ep = [n for n in names if n.endswith("entry_points.txt")][0]
          assert b"mercadolibre-mcp = mercadolibre_mcp.main:run" in z.read(ep)
          print("wheel validated:", whl.name)
          PY
